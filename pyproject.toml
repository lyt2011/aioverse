[project]
name = "aioverse"
version = "0.5.0"
description = "基于 aiohttp 实现的 OpenAI 兼容异步请求库"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "aiohttp>=3.11",
    "aiofiles==25.1.0",
    "orjson==3.11.9",
    "pydantic==2.13.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aioverse"]
